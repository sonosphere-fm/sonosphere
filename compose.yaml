# Production on the VPS. Checked out at /opt/spin/src; secrets and data stay in /opt/spin.
# Folders rather than single files are mounted from the checkout, since git replaces files on checkout.
# The app and Caddy use the host network so they see real visitor addresses and can reach the
# MusicBrainz mirror's SSH tunnel on 127.0.0.1:5480.
name: spin

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: /opt/spin/postgres.env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s

  valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy volatile-lru
    ports: ["127.0.0.1:6379:6379"]
    volumes: [valkey:/data]
    healthcheck:
      test: valkey-cli ping
      interval: 5s

  app:
    image: sonosphere:live
    restart: unless-stopped
    network_mode: host
    env_file: /opt/spin/spin.env
    volumes: [/opt/spin/data:/data]
    stop_grace_period: 20s
    deploy:
      replicas: 2
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/api/site').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      start_period: 30s

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/spin/src/deploy:/etc/caddy:ro
      - caddy:/data

  backup:
    image: postgres:17
    restart: unless-stopped
    env_file: /opt/spin/postgres.env
    environment:
      PGHOST: postgres
    volumes:
      - /opt/spin/src/deploy:/deploy:ro
      - /opt/spin-backup:/backups
    command: sh -c 'while true; do sh /deploy/backup.sh hourly; sleep 3600; done'
    depends_on:
      postgres: { condition: service_healthy }

  deployer:
    build: deploy/deployer
    image: sonosphere-deployer
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/spin:/opt/spin
      - /opt/spin-backup:/opt/spin-backup

volumes:
  pgdata:
  valkey:
  caddy:
