name: Feature request
description: Suggest an improvement or new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, mockups, or anything else that helps explain the idea.
    validations:
      required: false
