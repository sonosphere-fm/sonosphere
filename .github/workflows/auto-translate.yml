name: Auto-translate i18n

on:
  push:
    branches:
      - main
    paths:
      - "shared/i18n/en/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-translate
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run scripts/translate.ts
        env:
          TOKEN: ${{ secrets.DEEPL_TOKEN }}

      # Normalise formatting to match the repo style.
      - run: ./node_modules/.bin/biome format --write shared/i18n

      # Guard: translated files must still satisfy Translation<typeof en>.
      - run: bun run typecheck

      # Straight to main, and only when something was added.
      - run: |
          git diff --quiet -- shared/i18n && exit 0
          git config user.name sonosphere-bot
          git config user.email sonosphere-bot@users.noreply.github.com
          git add shared/i18n
          git commit -m "translate missing strings"
          git pull --rebase origin main
          git push origin HEAD:main
