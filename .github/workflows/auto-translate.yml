name: Auto-translate i18n

on:
  push:
    paths:
      - "shared/i18n/en/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translate
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run scripts/translate.ts
        env:
          TOKEN: ${{ secrets.DEEPL_TOKEN }}

      # Normalise formatting to match the repo style.
      - run: ./node_modules/.bin/biome format --write shared/i18n

      # Guard: translated files must still satisfy Translation<typeof en>.
      - run: bun run typecheck

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: shared/i18n
          commit-message: "chore(i18n): auto-translate missing strings"
          committer: sonosphere-bot <sonosphere-bot@users.noreply.github.com>
          author: sonosphere-bot <sonosphere-bot@users.noreply.github.com>
          branch: auto-translate
          delete-branch: true
          title: "chore(i18n): auto-translate missing strings"
          body: |
            Auto-translated missing i18n strings via the DeepL worker.

            Please review before merging — machine translation may miss nuance,
            especially placeholders (`{name}`, `{count}`) and tone.

          labels: i18n
